name: pr-check

permissions:
  contents: read

on: [pull_request]

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: "windows-2022"
          - os: "macos-14"
          - os: "ubuntu-24.04"
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install --frozen-lockfile

      - name: Run build:rpc
        run: pnpm build:rpc

      - name: Run build:channels
        run: pnpm build:channels

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run svelte check
        run: pnpm svelte:check

        # skip formatter on windows
      - name: Run formatter
        if: ${{ matrix.os=='ubuntu-24.04' || matrix.os=='macos-14' }}
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint:check

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build
        timeout-minutes: 40

  build-oci:
    name: build oci image
    runs-on: ubuntu-24.04
    steps:
      - name: Build OCI
        id: build
        uses: podman-desktop/gh-extensions-actions/.github/actions/oci-build@0abcba929bec797400b7fc1d6229f2907e1d4c1d # v0.2.0
        with:
          ref: ${{ github.ref }}
          containerfile: Containerfile

name: build and publish next image

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  extension-build:
    name: build oci image
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - name: Build OCI
        id: build
        uses: podman-desktop/gh-extensions-actions/.github/actions/oci-build@0abcba929bec797400b7fc1d6229f2907e1d4c1d # v0.2.0
        with:
          containerfile: Containerfile

  extension-publish:
    name: publish oci image
    if: ${{ !failure() && !cancelled() }}
    needs: extension-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
      packages: write
      checks: write
    steps:
      - name: Publish OCI
        uses: podman-desktop/gh-extensions-actions/.github/actions/oci-publish@2e7a02e8c8e9256a2fa466fb166e215175130dd7 # v0.1.2
        with:
          run-id: ${{ github.run_id }}
          artifact-id: ${{ needs.extension-build.outputs.artifact-id }}
          github-token: ${{ github.token }}
          registry-username: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ github.repository_owner }}/podman-desktop-extension-kubernetes-dashboard
          tags: next ${{ github.sha }}
